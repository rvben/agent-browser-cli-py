name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (e.g. 0.21.0 or 0.20.0.post1)'
        required: true
        type: string
  # Called directly by check-version.yml. Invoking this workflow rather than
  # relying on a tag push to trigger it is what removes the need for a personal
  # access token: a push made with the default GITHUB_TOKEN deliberately does
  # not start another workflow, but a workflow_call does.
  workflow_call:
    inputs:
      version:
        description: 'Version to build and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    name: Build wheels
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      # Keyed off inputs.version rather than github.event_name: under
      # workflow_call the event name is the CALLER's event (schedule), so a
      # push-vs-dispatch test would silently take the wrong branch. The inputs
      # context is populated for both workflow_dispatch and workflow_call, and
      # is empty for a tag push.
      - name: Parse version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            TAG_VERSION="$INPUT_VERSION"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "Error: '${TAG_VERSION}' is not a valid release version" >&2
            exit 1
          fi
          UPSTREAM_VERSION="${TAG_VERSION%%.post*}"
          echo "package_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package: ${TAG_VERSION}, upstream: ${UPSTREAM_VERSION}"

      - name: Build all platform wheels
        env:
          AGENT_BROWSER_VERSION: ${{ steps.version.outputs.upstream_version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: make wheels

      # A wheel built at an unintended version would publish under a name
      # nobody asked for, so the filenames are checked against the version this
      # run is releasing before anything leaves the runner. Requiring the count
      # to match the platform list also catches a platform that silently
      # dropped out of the build.
      - name: Check wheel versions
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          ls -lh dist/
          MATCHING=$(find dist -name "agent_browser_cli-${PACKAGE_VERSION}-*.whl" | wc -l | tr -d ' ')
          TOTAL=$(find dist -name '*.whl' | wc -l | tr -d ' ')
          if [ "$MATCHING" -ne 5 ] || [ "$MATCHING" -ne "$TOTAL" ]; then
            echo "Error: expected 5 wheels at version ${PACKAGE_VERSION}, found ${MATCHING} of ${TOTAL}" >&2
            exit 1
          fi
          echo "All ${TOTAL} wheels are at ${PACKAGE_VERSION}"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  verify:
    name: Verify on Linux
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Install uv
        run: pip install uv

      - name: End-to-end verification
        run: make verify-e2e

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: make publish-prod
