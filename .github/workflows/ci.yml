name: CI

# Everything the release does, run on the commit that could break it. Inside
# the release these same targets gate a publish, so a failure there is
# discovered when a version is already due to ship and the commit that caused
# it may be weeks old.
on:
  push:
    branches:
      - main
  pull_request:
  # Releases here are published by a schedule rather than by a push: this
  # repository took no commits at all between 2026-03-14 and 2026-08-10, while
  # the package it wraps moved from 0.20 to 0.33. A guard that runs only on a
  # push would not have run once in those five months, which is most of the
  # interval a release has to survive. Both jobs run on the schedule, because
  # the runner image and the actions they call float and can break a release
  # without anyone touching this repository. Scheduled runs always take the
  # workflow from the default branch, so this has no effect until it is on
  # main.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - name: Check the lockfile is current
        run: make lock-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Building the wheels and installing one is the rest of the release, and it
  # used to run only when a release was already due. Both steps have broken
  # there before: once on the cross-platform binary download, once on
  # verify-e2e. Rehearsing them on an ordinary push means an upstream packaging
  # change, a moved asset or a broken install surfaces on a commit rather than
  # on a publish. Runs independently of the test job so one red result does not
  # hide the other.
  rehearse:
    name: Rehearse the release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - name: Build and check wheels at the current upstream version
        run: make rehearse-release

      - name: End-to-end verification
        run: make verify-e2e
