[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-browser-cli"
description = "Python wrapper for agent-browser CLI — browser automation for AI agents, no npm required"
authors = [
    {name = "Ruben J. Jongejan", email = "ruben.jongejan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND MPL-2.0 AND ISC"
license-files = ["LICENSE", "agent_browser/licenses/*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
agent-browser = "agent_browser.cli:entry_point"
agent-browser-cli = "agent_browser.cli:entry_point"

[tool.setuptools]
packages = ["agent_browser"]
include-package-data = true
package-data = {"agent_browser" = ["bin/*", "skill-data/**/*", "skills/**/*", "licenses/*", "upstream.json"]}

[tool.setuptools.dynamic]
version = {attr = "agent_browser.version.__version__"}

[tool.setuptools.cmdclass]
build_py = "setup.CustomBuildPy"
sdist = "setup.CustomSdist"
bdist_wheel = "setup.PlatformBdistWheel"

[dependency-groups]
dev = [
    "setuptools>=77.0.3",
    "pytest>=9.1.1",
    # Lets the tests read the release steps out of the workflow YAML and run
    # them, rather than restating what those steps are believed to do.
    "pyyaml>=6.0",
    # The floor moves with the toolchain rather than recording the oldest ruff
    # that would still pass; the exact version comes from the committed uv.lock.
    # Both matter: without a lock every CI run resolved whatever ruff was newest
    # that day, and a release that added a rule failed lint on unchanged code
    # and blocked publishing. Leaving the floor behind the lock buys nothing,
    # since it only widens the set of rule sets an install without the lock
    # could land on.
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"
